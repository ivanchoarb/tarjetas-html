name: Desplegar tarjetas
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      # Un proyecto de Cloudflare Pages por cliente: <id>-card.pages.dev
      # ponytail: despliega todos en cada push; desplegar solo los cambiados si pasan de ~50 clientes
      - run: |
          for d in dist/*/; do
            id=$(basename "$d")
            npx -y wrangler@3 pages project create "$id-card" --production-branch main 2>/dev/null || true
            npx -y wrangler@3 pages deploy "$d" --project-name "$id-card" --branch main
          done
